# Development tooling only. The two scripts carry their own dependencies
# inline (PEP 723) and run with `uv run --script` without any of this; the
# project table exists so that `uv run pytest` and `uv run ruff` have an
# environment and a configuration to work from.
[project]
name = "a2a"
version = "0"
description = "A local mesh of agent CLIs, wrapped as A2A servers"
requires-python = ">=3.11"
# Mirrors the inline metadata of the two scripts; tests/test_metadata.py
# fails when the two drift apart.
dependencies = [
    "a2a-sdk[http-server]>=0.3,<0.4",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "mcp>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[tool.uv]
# Nothing to build or install: `make install` copies the scripts into place.
package = false

[tool.ruff]
# The scripts have no .py suffix, so ruff must be told that they are Python.
extend-include = ["a2a-agentd", "a2a-mcp"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
